        const evaluatePassword = (pwd) => {
            let score = 0;
            if (!pwd) return { score: 0, label: "Empty", color: "bg-slate-600" };
            
            score += pwd.length * 3;
            
            if (/[A-Z]/.test(pwd)) score += 10;
            if (/[a-z]/.test(pwd)) score += 10;
            if (/[0-9]/.test(pwd)) score += 10;
            if (/[^A-Za-z0-9]/.test(pwd)) score += 15;
            
            if (pwd.length >= 16 && /[-_ ]/.test(pwd)) score += 15;

            if (/^[a-zA-Z]+$/.test(pwd)) score -= 15;
            if (/^[0-9]+$/.test(pwd)) score -= 20;

            score = Math.min(100, Math.max(0, score));
            
            if (score < 40) return { score, label: "Weak", color: "bg-red-500" };
            if (score < 70) return { score, label: "Fair", color: "bg-yellow-500" };

                                                src={`Pass-Hero-${step}.gif`} 
                                                alt={`Hero for step ${step}`}
                                                className="w-full h-auto rounded-md border border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.3)] animate-bounce-slow"
                                            />
                                        )}

                                        {/* Progress Bar */}
                                        <div className={`h-2 rounded-full transition-all duration-500 ${step <= level ? 'bg-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.5)]' : 'bg-slate-800'}`}></div>
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="min-h-[400px]">
                            {level === 1 && renderLevel1()}
                            {level === 2 && renderLevel2()}
                            {level === 3 && renderLevel3()}
                            {level === 4 && renderLevel4()}
                            {level === 5 && renderLevel5()}
                            {level === 6 && renderLevel6()}
                            {level === 7 && renderLevel7()}
                            {level === 8 && renderLevel8()}
                            {level === 9 && renderLevel9()}
                            {level === 10 && renderLevel10()}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
